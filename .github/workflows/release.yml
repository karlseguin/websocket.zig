name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version single source of truth: build.zig.zon `.version`. The tag must be "v" + that string.
      - name: Tag matches build.zig.zon version
        run: |
          zon=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          test "v$zon" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != v$zon (build.zig.zon .version). Bump the zon version, commit, then tag (tools/release.sh)."; exit 1; }

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Test
        run: zig build test --summary all

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
